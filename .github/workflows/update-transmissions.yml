name: NCS - Processar transmissão

on:
  issues:
    types: [opened]

# O workflow usa somente o token automático do GitHub Actions.
# Nenhum PAT/token pessoal fica no index.html.
permissions:
  contents: write
  issues: write

jobs:
  process-ncs-request:
    # Somente uma Issue aberta pela conta proprietária do repositório
    # pode alterar transmissions.json.
    if: >-
      startsWith(github.event.issue.title, '[NCS]') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extrair e validar solicitação NCS
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = os.environ.get("ISSUE_BODY") or ""
          start_marker = "<!-- NCS_PAYLOAD_START"
          end_marker = "NCS_PAYLOAD_END -->"

          start = body.find(start_marker)
          end = body.find(end_marker, start + len(start_marker)) if start >= 0 else -1

          if start < 0 or end < 0:
              raise SystemExit("Solicitação NCS inválida: payload não encontrado.")

          raw = body[start + len(start_marker):end].strip()

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"JSON da solicitação inválido: {exc}")

          if payload.get("version") != 1:
              raise SystemExit("Versão de solicitação NCS não suportada.")

          action = payload.get("action")
          if action == "upsert":
              item = payload.get("transmission")
              if not isinstance(item, dict):
                  raise SystemExit("Transmissão ausente.")

              required = ("id", "code", "title", "message")
              if any(not isinstance(item.get(k), str) for k in required):
                  raise SystemExit("A transmissão deve conter id, code, title e message como texto.")

              if not item["id"].strip() or not item["code"].strip():
                  raise SystemExit("ID e código não podem ficar vazios.")

          elif action == "delete":
              if not isinstance(payload.get("id"), str) or not isinstance(payload.get("code"), str):
                  raise SystemExit("Exclusão inválida: id e code são obrigatórios.")
              if not payload["id"].strip() or not payload["code"].strip():
                  raise SystemExit("ID e código não podem ficar vazios.")
          else:
              raise SystemExit(f"Ação não suportada: {action!r}")

          Path("ncs_payload.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Solicitação válida: {action}")
          PY

      - name: Atualizar transmissions.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          db_path = Path("transmissions.json")
          payload_path = Path("ncs_payload.json")

          if db_path.exists():
              try:
                  data = json.loads(db_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"transmissions.json inválido: {exc}")
          else:
              data = []

          if not isinstance(data, list):
              raise SystemExit("transmissions.json precisa conter um array JSON.")

          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          action = payload["action"]

          def key(item):
              return (item["id"].strip().lower(), item["code"].strip().lower())

          if action == "upsert":
              item = payload["transmission"]
              item = {
                  "id": item["id"].strip(),
                  "code": item["code"].strip(),
                  "title": item["title"].strip(),
                  "message": item["message"]
              }

              target = key(item)
              found = False
              for i, existing in enumerate(data):
                  if isinstance(existing, dict) and all(k in existing for k in ("id", "code")) and key(existing) == target:
                      data[i] = item
                      found = True
                      break

              if not found:
                  data.append(item)

              print("Transmissão inserida/atualizada:", item["id"], "//", item["code"])

          elif action == "delete":
              target = (payload["id"].strip().lower(), payload["code"].strip().lower())
              old_len = len(data)
              data = [
                  item for item in data
                  if not (isinstance(item, dict) and all(k in item for k in ("id", "code")) and key(item) == target)
              ]
              if len(data) == old_len:
                  print("Nenhuma transmissão correspondente encontrada para exclusão.")
              else:
                  print("Transmissão excluída:", payload["id"], "//", payload["code"])

          db_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Publicar alteração no repositório
        id: commit
        run: |
          git config user.name "NCS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transmissions.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração necessária."
            exit 0
          fi

          git commit -m "NCS: atualizar transmissions.json"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Registrar resultado na Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "N.C.S. // TRANSMISSÃO PUBLICADA COM SUCESSO.\n\n`transmissions.json` foi atualizado pelo GitHub Action."
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "N.C.S. // SOLICITAÇÃO PROCESSADA.\n\nNenhuma alteração foi necessária no banco."
          fi
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"
